<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>八一班</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0);outline:none}
*:focus,*:focus-visible,*:active{outline:none;box-shadow:none}
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#111;background:#f5f5f7;overflow-x:hidden;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{font-size:16px!important}
.hide{display:none!important}
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;height:calc(52px + var(--safe-t));padding:var(--safe-t) 16px 0;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.05)}
.brand{font-size:17px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#333;position:relative}
.icon-btn:active{background:rgba(0,0,0,.06)}
.icon-btn .dot{position:absolute;top:4px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e53935;color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}
.mini-avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;color:#c0c0c0;flex-shrink:0}
.mini-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.mini-avatar svg{width:18px;height:18px}
main{padding:16px 14px calc(96px + var(--safe-b));max-width:600px;margin:0 auto}
.page{display:none}
.page.active{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hello{padding:6px 4px 18px}
.hello h1{font-size:22px;font-weight:700;margin-bottom:4px}
.hello p{font-size:13px;color:#888}
.card{display:flex;align-items:center;gap:14px;padding:18px 16px;margin-bottom:10px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 1px 3px rgba(0,0,0,.03);cursor:pointer;transition:.15s}
.card:active{transform:scale(.99);background:#fafafa}
.card .ci{width:40px;height:40px;border-radius:10px;background:#f2f2f4;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#333;flex-shrink:0}
.card .ct{flex:1;min-width:0}
.card .ctt{font-size:15px;font-weight:600;margin-bottom:2px}
.card .cts{font-size:12.5px;color:#999}
.card .ca{color:#ccc;font-size:18px}
.me-head{display:flex;align-items:center;gap:16px;padding:20px 18px;border-radius:16px;background:#fff;border:1px solid rgba(0,0,0,.04);box-shadow:0 1px 3px rgba(0,0,0,.03);margin-bottom:14px}
.me-avatar{width:60px;height:60px;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;color:#c0c0c0;flex-shrink:0}
.me-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.me-avatar svg{width:32px;height:32px}
.me-info h2{font-size:18px;font-weight:700;margin-bottom:5px}
.me-info .role{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;background:#f0f0f0;color:#666;font-weight:500}
.list{background:#fff;border-radius:14px;overflow:hidden;border:1px solid rgba(0,0,0,.04);box-shadow:0 1px 3px rgba(0,0,0,.03);margin-bottom:12px}
.item{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-bottom:1px solid #f2f2f4;cursor:pointer;font-size:14.5px}
.item:last-child{border-bottom:0}
.item:active{background:#fafafa}
.item .iv{color:#bbb;font-size:13px}
.item.danger .lbl{color:#d32f2f}
.gtitle{font-size:13px;font-weight:600;color:#888;padding:6px 4px;margin-bottom:4px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.06);padding-bottom:var(--safe-b)}
.bottom-nav .tab{flex:1;padding:11px 4px 13px;text-align:center;font-size:12px;color:#999;font-weight:500;position:relative}
.bottom-nav .tab.active{color:#111;font-weight:700}
.bottom-nav .tab .dot{position:absolute;top:6px;right:24%;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#e53935;color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:600}
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + var(--safe-b));max-height:88vh;overflow-y:auto}
