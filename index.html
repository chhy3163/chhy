function renderGallery(){var arr=[];if(galleryFilter==='all'){arr=allPhotos.filter(function(p){return !p.is_private})}else if(galleryFilter==='me'){arr=allPhotos.filter(function(p){return p.uploader_id===me.id&&!p.is_private})}else if(galleryFilter==='private'){arr=allPhotos.filter(function(p){return p.uploader_id===me.id&&p.is_private})}photos=arr;var g=$('grid');if(!photos.length){g.innerHTML='';$('galempty').classList.remove('hide');return}$('galempty').classList.add('hide');var groups={},today=new Date().toDateString(),yesterday=new Date(Date.now()-86400000).toDateString();photos.forEach(function(p){var d=new Date(p.time||Date.now()).toDateString();if(!groups[d])groups[d]=[];groups[d].push(p)});var html='';Object.keys(groups).forEach(function(ds){var d=new Date(ds),title=ds===today?'今天':(ds===yesterday?'昨天':(d.getMonth()+1)+'月'+d.getDate()+'日');html+='<div class="timeline-group"><div class="timeline-title">'+title+'</div><div class="timeline-grid">';groups[ds].forEach(function(p){var idx=photos.indexOf(p),isSel=selectedPhotoIds.indexOf(p.id)>-1,style=isSel?'style="border:3px solid #111;"':'',check=isSelectMode?'<div style="position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:'+(isSel?'#111':'rgba(0,0,0,0.3)')+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;z-index:2;">'+(isSel?'✓':'')+'</div>':'';html+='<div class="timeline-thumb" '+style+' onclick="onPhotoClick('+idx+',\''+p.id+'\')"><img src="'+esc(p.thumbUrl)+'" loading="lazy" decoding="async">'+check+'</div>'});html+='</div></div>'});g.innerHTML=html}
window.batchDownload=async function(){if(!selectedPhotoIds.length)return toast('请选择');toast('开始下载...');for(var i=0;i<selectedPhotoIds.length;i++){var p=allPhotos.find(function(x){return x.id===selectedPhotoIds[i]});if(p){try{var r=await fetch(p.url),blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=p.name||'photo.jpg';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);await new Promise(res=>setTimeout(res,600))}catch(e){}}}toast('下载完毕')};
window.batchDelete=async function(){if(!selectedPhotoIds.length)return toast('请选择');if(!confirm('确定删除吗？'))return;var toDel=[];selectedPhotoIds.forEach(function(id){var p=allPhotos.find(function(x){return x.id===id});if(p&&(p.uploader_id===me.id))toDel.push(id)});if(!toDel.length)return toast('只能删自己的');toast('删除中...');for(var i=0;i<toDel.length;i++){await sb('photos?id=eq.'+encodeURIComponent(toDel[i]),{method:'DELETE'});allPhotos=allPhotos.filter(function(x){return x.id!==toDel[i]})}toast('已删除');toggleSelectMode(false)};
function openLB(i){if(!photos.length||i<0||i>=photos.length)return;lbIdx=i;var target=photos[i].url,thumb=photos[i].thumbUrl;$('lightbox').style.display='block';$('lbimg').style.opacity='0';$('lbimgThumb').src=thumb||target;$('lbcount').textContent=(i+1)+'/'+photos.length;_preloadAround(i);var im=_fullCache[target]||new Image();_fullCache[target]=im;im.onload=function(){if(lbIdx!==i)return;$('lbimg').src=target;$('lbimg').style.transition='opacity 0.3s';$('lbimg').style.opacity='1'};if(!im.src)im.src=target}
function _preloadAround(i){if(photos.length<=1)return;[(i-1+photos.length)%photos.length,(i+1)%photos.length].forEach(function(idx){var u=photos[idx].url;if(!_fullCache[u]){var im=new Image();im.onerror=function(){};im.src=u;_fullCache[u]=im}})}
$('lbclose').onclick=function(){$('lightbox').style.display='none';lbIdx=-1};$('lbprev').onclick=function(){if(photos.length<2)return;openLB((lbIdx-1+photos.length)%photos.length)};$('lbnext').onclick=function(){if(photos.length<2)return;openLB((lbIdx+1)%photos.length)};
async function loadAllPhotos(){if(photosLoaded)return allPhotos;var list=await sb('photos?order=time.desc&limit=500');var seen={};allPhotos=[];list.forEach(function(p){if(seen[p.id])return;seen[p.id]=1;var o=Object.assign({},p);o.url=p.filename.indexOf('http')===0?p.filename:SB+'/storage/v1/object/public/photos/'+p.filename;o.thumbUrl=(p.thumb&&p.thumb.indexOf('http')===0)?p.thumb:o.url;allPhotos.push(o)});photosLoaded=true;return allPhotos}
async function openGallery(){if(!photosLoaded){try{await loadAllPhotos()}catch(e){allPhotos=[];photosLoaded=true}}renderGallery()}
$('lg-btn').onclick=async function(){var acc=$('lg-account').value,pwd=$('lg-pwd').value;if(!acc||!pwd)return toast('请填完整');try{var us=await sb('users?or=(qq.eq.'+acc+',token.eq.'+acc+')&limit=1');if(!us.length)return toast('账号不存在');var u=us[0];if(u.status!=='active')return toast('状态异常');localStorage.setItem('bayan',JSON.stringify(u));me=u;$('ov-login').style.display='none';renderHome();toast('欢迎，'+u.name)}catch(e){toast('登录失败')}};
$('btn-top-avatar').onclick=function(){if(me)alert('当前：'+me.name);else $('ov-login').style.display='flex'};
function renderHome(){if(me){$('hi').textContent='你好，'+me.name;$('his').textContent='身份：'+roleName(me.role)}else{$('hi').textContent='你好';$('his').textContent='请先登录'}var list=[{k:'gallery',t:'相册',s:'浏览班级照片'},{k:'chat',t:'聊天',s:'群聊和私聊'}];if(isAdmin())list.push({k:'admin',t:'管理后台',s:'审核与权限'});$('home-cards').innerHTML=list.map(function(x){return '<div class="card" onclick="if(!me){$(\'ov-login\').style.display=\'flex\';return}'+(x.k==='admin'?'openAdmin()':'go(\''+x.k+'\')')+'"><div class="ci"><svg viewBox="0 0 24 24">'+(x.k==='gallery'?'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-4 4-3-3-6 6"/>':(x.k==='chat'?'<path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.5A8.5 8.5 0 1 1 21 12z"/>':'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.8 3.1-6.5 7-6.5s7 2.7 7 6.5"/>'))+'</svg></div><div class="ct"><div class="ctt">'+x.t+'</div><div class="cts">'+x.s+'</div></div><div class="ca">›</div></div>'}).join('')}
document.querySelectorAll('.bottom-nav .tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});var p=b.dataset.page;document.getElementById('page-'+p).classList.add('active');b.classList.add('active');if(p==='gallery'){if(!me){$('ov-login').style.display='flex';return}openGallery()}if(p==='chat'){if(!me){$('ov-login').style.display='flex';return}renderDMConv()}}});
window.go=function(name){document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active')});document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active')});document.getElementById('page-'+name).classList.add('active');if(name==='gallery')openGallery();if(name==='chat')renderDMConv()};
window.openGroupChat=function(){if(!me)return;var dv=document.createElement('div');dv.id='chatDetailView';dv.className='full-screen-chat';dv.style.display='flex';dv.innerHTML='<div style="display:flex;align-items:center;padding:10px;border-bottom:1px solid #ececec;"><button onclick="this.parentNode.parentNode.remove()" style="font-size:24px;padding:0 10px;">‹</button><div style="flex:1;text-align:center;font-weight:600;">班级群聊</div><div style="width:40px;"></div></div><div id="chatDetailList" style="flex:1;overflow-y:auto;padding:10px;"></div><div style="display:flex;padding:10px;border-top:1px solid #ececec;"><input id="chatDetailInput" style="flex:1;padding:10px;border:1px solid #ccc;border-radius:20px;margin-right:8px;"><button onclick="sendMsg()" class="btn primary pill">发送</button></div>';document.body.appendChild(dv);loadChatDetail();chatTimer=setInterval(loadChatDetail,3000)};
window.sendMsg=async function(){var input=document.getElementById('chatDetailInput');var v=input.value.trim();if(!v||sendingLock)return;sendingLock=true;input.value='';try{await sb('chat',{method:'POST',body:JSON.stringify([{id:Date.now(),user_id:me.id,text:v,time:Date.now()}])})}catch(e){toast('发送失败')}sendingLock=false;loadChatDetail()};
async function loadChatDetail(){if(!me)return;try{var list=await sb('chat?id=gt.'+chatLast+'&order=id.asc&limit=50');var box=document.getElementById('chatDetailList');if(!box)return;list.forEach(function(m){chatLast=Math.max(chatLast,+m.id);var d=document.createElement('div');d.style.marginBottom='10px';d.innerHTML='<div style="font-size:12px;color:#999;">'+esc(m.user_id)+'</div><div style="background:#f0f0f0;padding:8px;border-radius:8px;margin-top:2px;">'+esc(m.text)+'</div>';box.appendChild(d)});box.scrollTop=box.scrollHeight}catch(e){}}
async function renderDMConv(){if(!me)return;try{var list=await sb('dm?or=(from_id.eq.'+me.id+',to_id.eq.'+me.id+')&order=time.desc&limit=100');var map={};list.forEach(function(m){var other=m.from_id===me.id?m.to_id:m.from_id;if(!map[other])map[other]={last:m.text,time:m.time}});var box=$('dmconv');if(!box)return;box.innerHTML=Object.keys(map).map(function(k){return '<div class="chat-item" onclick="openDM(\''+k+'\')"><div class="ci-av">'+SVG+'</div><div class="ci-info"><div class="ci-name">用户 '+k+'</div><div class="ci-last">'+esc(map[k].last)+'</div></div></div>'}).join('')}catch(e){}}
window.openDM=async function(id){toast('私聊功能演示')};
window.openAI=async function(){toast('AI高玩已就绪')};
window.openAdmin=async function(){toast('管理后台已就绪')};
window.startScan=function(){toast('扫码功能维护中')};window.openDeviceAuth=function(){toast('设备授权维护中')};window.openApiConfig=function(){toast('API配置维护中')};
(async function(){var s=localStorage.getItem('bayan');if(s){try{me=JSON.parse(s)}catch(e){}}renderHome();if(!me){$('ov-login').style.display='flex'}setTimeout(function(){var sp=$('splash');if(sp)sp.style.display='none'},1500)})();
</script></body></html>
